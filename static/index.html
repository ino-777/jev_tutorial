<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>jev TODO</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>jev TODO</h1>
    <p class="subtitle">
      新しいタスクを追加すると、TypeSafe AI の <code>jev-latest</code> モデルが
      カテゴリ・緊急度・優先度を自動で判定します。
    </p>

    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="やることを入力…" autocomplete="off" required />
      <input id="todo-deadline" type="datetime-local" />
      <button type="submit">追加</button>
    </form>

    <p id="error" class="error" hidden></p>
    <ul id="todo-list"></ul>
  </main>
  <script src="/app.js"></script>
</body>
</html>
